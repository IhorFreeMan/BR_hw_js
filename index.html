<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lesosn_29 JS Array</title>
    <link rel="stylesheet" href="./css/main.css">

</head>

<body>
    <header class="header">
        <div class="container">
            <h1 class="title header__title">JavaScript</h1>
        </div>
    </header>
    <main class="main">
        <div class="container">
            <h1>Список пісень</h1>
            <ol id="playlist-container"></ol>
        </div>

        <div class="container">
            <h1>Модальне вікно</h1>
            <button id="openModalBtn">Відкрити модальне вікно</button>

            <div id="myModal" class="modal">
                <div class="modal-content">
                    <h2>Привіт! </h2>
                    <p>Це модальне вікно, створене за допомогою DOM.</p>
                    <button id="closeModalBtn">Закрити</button>
                </div>
            </div>
        </div>

        <section class="new-el" id="new-el">
            <a class="create-link" data-tagname="a">Create a</a>
            <a class="create-link" data-tagname="p">Create p</a>
            <a class="create-link" data-tagname="div">Create div</a>
        </section>

    </main>
    <footer class="footer">
        <div class="container">
            <p>All rights reserved! 2025</p>
        </div>
    </footer>

    <!-- <script src="./js/playlist.js"></script>
    <script src="./js/modal.js"></script> -->
    <script src="./js/main.js"></script>
    
</body>

</html>
